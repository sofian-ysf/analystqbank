name: Generate Blog Posts [DISABLED]

on:
  # All triggers disabled — blog generation turned off
  #schedule:
  #  - cron: '0 6 * * *'
  #workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog generation
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "https://www.analysttrainer.com/api/cron/generate-blog" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET1 }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Failed to generate blog post"
            exit 1
          fi
